<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#111013;}
  .card{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:56px 72px 52px;display:flex;flex-direction:column;justify-content:space-between;}
  .rule{position:absolute;left:72px;right:72px;top:136px;height:1px;background:#e3e0da;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .label{font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#6b6760;}
  .mark{width:48px;height:48px;color:#111013;}
  h1{margin:0;font-weight:800;letter-spacing:-.045em;line-height:.92;font-size:var(--size,112px);text-wrap:balance;max-width:1000px;}
  h1 .accent{color:var(--accent,#111013);}
  .sub{margin-top:24px;font-size:26px;font-weight:400;color:#6b6760;line-height:1.3;max-width:900px;}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between;}
  .url{font-size:20px;font-weight:600;letter-spacing:.06em;color:#111013;}
</style>
</head>
<body>
<div class="card" style="--size:%SIZE%;--accent:%ACCENT%">
  <div class="top">
    <span class="label">%KICKER%</span>
    <svg class="mark" viewBox="0 0 160 160" fill="currentColor"><path d="M147.22,124.99l.2,22.96-67.4.05-.3-38.21c-5.07,20.91-20.84,36.39-42.43,38-8.19.61-16.08.05-24.72.14l.47-91.57c.12-23.5,19.87-43.14,43.16-43.97,16.52-.59,31.84-.62,48.27.03,23.3.91,41.54,20.86,42.74,43.68.44,8.32.15,15.7.14,24.03l-38.03.34c21.38,4.78,37.72,22.19,37.91,44.54ZM93.69,100.97c4.42-.69,7.11-4.16,6.97-8.38l.05-33.99-33.37.2c-4.77-.18-7.94,3.21-8.36,7.83l.03,34.22,34.68.12Z"/></svg>
  </div>
  <div class="rule"></div>
  <div>
    <h1>%TITLE%</h1>
    <div class="sub">%SUB%</div>
  </div>
  <div class="bottom">
    <span class="url">rmbergonia.com</span>
    <span class="label">%FOOT%</span>
  </div>
</div>
</body>
</html>
